[preset.0]

name="Linux Dedicated Server"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=true
custom_features=""
export_filter="all_resources"
include_filter="effects/toon_explosions/profiles.json"
exclude_filter="astrofar/*,tests/*,build/*,backup/*,FuncGodot Manual/*,ref/*,Unity/*,Unreal Engine/*,GodotAnims/*,*.blend,assets/character_models/glb/human/movement_animations.glb,assets/character_models/glb/human/Human_Ultimate_Fixed_Rig_MODEL.glb,assets/character_models/mannequin/mannequin_reference.tscn,assets/character_models/flier/flier.fbx,assets/character_models/flier/ninja.glb,assets/character_models/flier/Human_Ultimate_Fixed_Rig1.glb,assets/weapon_models/ak47/ak-47.glb,assets/fonts/Kaisei_Decol/*,assets/fonts/Montserrat/*"
export_path="build/linux/multiplayer-system-3d-server.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
binary_format/architecture="x86_64"
binary_format/convert_text_resources_to_binary=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash
export DISPLAY=:0
unzip -o -q \"{temp_dir}/{archive_name}\" -d \"{temp_dir}\"
\"{temp_dir}/{exe_name}\" {cmd_args}"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash
kill $(pgrep -x -f \"{temp_dir}/{exe_name} {cmd_args}\")
rm -rf \"{temp_dir}\""
